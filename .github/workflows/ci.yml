name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build ./cmd/... ./internal/... ./gguf/... ./math/... ./model/... ./tokenizer/...
      - run: go test ./gguf/... ./math/... ./model/... ./tokenizer/... -v
